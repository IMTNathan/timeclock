<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="../icon-192.png">
<title>IMT Timeclock · Admin</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --navy:#1f3a5f; --navy2:#2a4b78; --green:#1e8e3e; --red:#c5221f; --amber:#b06000; --bg:#f3f4f6; --card:#fff; --line:#e2e5ea; --muted:#5f6b7a; --hi:#eef3fa; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:#111; font-size:14px; }
  .layout { display:grid; grid-template-columns:220px 1fr; min-height:100vh; }
  aside { background:var(--navy); color:#fff; display:flex; flex-direction:column; }
  aside .brand { padding:18px 18px 14px; font-weight:700; font-size:16px; border-bottom:1px solid rgba(255,255,255,.12); }
  aside .brand small { display:block; font-weight:400; opacity:.7; font-size:12px; margin-top:2px; }
  aside nav { padding:8px 0; flex:1; }
  aside nav a { display:flex; justify-content:space-between; align-items:center; padding:10px 18px; color:rgba(255,255,255,.85); text-decoration:none; cursor:pointer; }
  aside nav a:hover { background:var(--navy2); }
  aside nav a.on { background:#fff; color:var(--navy); font-weight:600; }
  aside nav .badge { background:var(--red); color:#fff; border-radius:999px; font-size:11px; padding:1px 7px; }
  aside .who { padding:14px 18px; border-top:1px solid rgba(255,255,255,.12); font-size:13px; }
  aside .who a { color:#fff; opacity:.8; cursor:pointer; text-decoration:underline; }
  main { padding:22px 28px; overflow:auto; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin-bottom:16px; }
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .toolbar .grow { flex:1; }
  .card { background:var(--card); border-radius:12px; padding:16px 18px; margin-bottom:16px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px; margin-bottom:16px; }
  .tile { background:#fff; border-radius:12px; padding:14px 16px; box-shadow:0 1px 2px rgba(0,0,0,.06); cursor:pointer; }
  .tile .n { font-size:28px; font-weight:700; }
  .tile .l { color:var(--muted); font-size:13px; }
  .tile.warn .n { color:var(--amber); } .tile.bad .n { color:var(--red); } .tile.ok .n { color:var(--green); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.02em; position:sticky; top:0; background:#fff; z-index:1; cursor:default; }
  th.sort { cursor:pointer; } th.sort:hover { color:var(--navy); }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  tr:hover td { background:#fafbfc; }
  tr.sel td { background:var(--hi); }
  tfoot td { font-weight:700; border-top:2px solid var(--line); }
  .btn { border:1px solid #c9ced6; background:#fff; border-radius:8px; padding:7px 12px; font-size:14px; cursor:pointer; }
  .btn:hover { border-color:var(--navy); }
  .btn.primary { background:var(--navy); color:#fff; border-color:var(--navy); }
  .btn.green { background:var(--green); color:#fff; border-color:var(--green); }
  .btn.red { background:var(--red); color:#fff; border-color:var(--red); }
  .btn.sm { padding:4px 9px; font-size:13px; }
  .btn:disabled { opacity:.45; cursor:default; }
  input, select { font-size:14px; padding:7px 9px; border:1px solid #c9ced6; border-radius:8px; background:#fff; }
  input[type=checkbox] { width:16px; height:16px; }
  label.f { display:block; font-size:12px; color:var(--muted); margin:10px 0 3px; }
  .tag { display:inline-block; font-size:12px; padding:1px 8px; border-radius:999px; background:#eef1f5; color:var(--muted); margin:1px 2px 1px 0; white-space:nowrap; }
  .tag.ok { background:#e6f4ea; color:var(--green); } .tag.warn { background:#fef0e0; color:var(--amber); } .tag.bad { background:#fce8e6; color:var(--red); }
  .muted { color:var(--muted); }
  .msg { background:#e6f4ea; color:var(--green); padding:9px 12px; border-radius:8px; margin-bottom:12px; }
  .err { background:#fce8e6; color:var(--red); padding:9px 12px; border-radius:8px; margin-bottom:12px; }
  .scroll { max-height:calc(100vh - 230px); overflow:auto; }
  dialog { border:0; border-radius:12px; padding:20px; width:min(560px, 94vw); }
  dialog.wide { width:min(900px, 94vw); }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .login { max-width:360px; margin:12vh auto; background:#fff; border-radius:14px; padding:26px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  .login h1 { margin-bottom:14px; }
  .login input { width:100%; font-size:16px; padding:10px; }
  #map, #dmap { height:420px; border-radius:10px; }
  .split { display:grid; grid-template-columns:1.1fr 1fr; gap:16px; }
  .hide { display:none !important; }
  .nowrap { white-space:nowrap; }
  .toolbar select { max-width:240px; }
  @media print { aside, .toolbar button, .toolbar select, .toolbar input { display:none !important; } .layout { display:block; } main { padding:0; } .scroll { max-height:none; overflow:visible; } .card { box-shadow:none; } }
  @media (max-width:900px) { .layout { grid-template-columns:1fr; } aside nav { display:flex; overflow-x:auto; } .split { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div id="root"></div>
<dialog id="dlg"><div id="dlgBody"></div></dialog>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';
const sb = createClient('https://qjruoobyecsgxxgxbkja.supabase.co', 'sb_publishable_-KhWyifowntUK9kRHHGCxA_mOfuWMxA', { auth: { persistSession: true, autoRefreshToken: true } });

// ---------- helpers ----------
const $root = document.getElementById('root');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const z = n => String(n).padStart(2, '0');
const dstr = (d = new Date()) => `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
const addDays = (ds, n) => { const d = new Date(ds + 'T12:00:00'); d.setDate(d.getDate() + n); return dstr(d); };
const weekStart = ds => { const d = new Date(ds + 'T12:00:00'); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return dstr(d); };
const fDate = ds => new Date(ds + 'T12:00:00').toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
const fTime = iso => iso ? new Date(iso).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' }) : '—';
const h = n => (Math.round((+n || 0) * 100) / 100).toFixed(2);
const fDist = m => { if (m == null) return ''; const ft = m * 3.28084; return ft < 1000 ? `${Math.round(ft / 10) * 10} ft` : `${(ft / 5280).toFixed(1)} mi`; };
const toLocalInput = iso => { if (!iso) return ''; const d = new Date(iso); return `${dstr(d)}T${z(d.getHours())}:${z(d.getMinutes())}`; };
const ERR = { already_clocked_in:'Already clocked in.', not_allowed:'Not allowed.', reason_required:'A reason is required.', pin_must_be_6_digits:'PIN must be 6 digits.', cost_code_required:'This job needs a cost code.', cost_code_not_on_job:'That cost code is not on this job.', employee_not_found:'Employee not found.' };
const errText = e => { const m = e?.message || String(e); for (const k in ERR) if (m.includes(k)) return ERR[k]; return /fetch|network/i.test(m) ? 'Connection problem — try again.' : m; };
function csv(rows, cols, name) {
  const body = [cols.map(c => c[1]).join(','), ...rows.map(r => cols.map(c => `"${String(typeof c[0] === 'function' ? c[0](r) : r[c[0]] ?? '').replace(/"/g, '""')}"`).join(','))].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], { type:'text/csv' })); a.download = name; a.click();
}
async function all(query) { // page through >1000 rows
  let out = [], from = 0;
  for (;;) { const { data, error } = await query().range(from, from + 999); if (error) throw error; out = out.concat(data); if (data.length < 1000) return out; from += 1000; }
}

// ---------- state ----------
const S = { me:null, page:'dashboard', week:weekStart(dstr()), jobs:[], ccs:[], emps:[], flash:'', filters:{ status:'review', emp:'', job:'', q:'' }, sort:{ col:'work_date', dir:1 } };

function statusTags(s) {
  const t = [];
  if (s.missed_clockout) t.push('<span class="tag bad">Missed clock-out</span>');
  else if (!s.clock_out) t.push('<span class="tag">On the clock</span>');
  else if (s.status === 'approved') t.push('<span class="tag ok">Approved</span>');
  else if (s.status === 'rejected') t.push(`<span class="tag bad" title="${esc(s.decline_reason)}">Declined: ${esc(s.decline_reason || '')}</span>`);
  else t.push('<span class="tag warn">To approve</span>');
  if (s.worker_response === 'declined') t.push(`<span class="tag warn" title="${esc(s.worker_note)}">Worker declined: ${esc(s.worker_note || '')}</span>`);
  if (s.worker_response === 'accepted') t.push('<span class="tag ok">Worker accepted</span>');
  if (s.outside_in) t.push(`<span class="tag bad">In outside ${fDist(s.in_distance_m)}</span>`);
  if (s.outside_out) t.push(`<span class="tag bad">Out outside ${fDist(s.out_distance_m)}</span>`);
  if (s.outside_checks > 0) t.push(`<span class="tag warn">Left site ${fDist(s.outside_check_max_m)}</span>`);
  if (s.clock_out && s.job_has_no_location) t.push('<span class="tag" title="Job has no geofence">No job location</span>');
  return t.join(' ');
}
const needsReview = s => s.clock_out && s.status !== 'approved';
const jobLabel = c => { const j = S.jobs.find(x => x.code === c); return j ? `${j.code} – ${j.description}` : (c || '—'); };

// ---------- auth ----------
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderLogin();
  const { data: me } = await sb.from('tc_employees').select('*').eq('is_me', true).maybeSingle();
  if (!me || !['office','admin'].includes(me.role)) { await sb.auth.signOut(); return renderLogin('This site is for office staff. Crews and foremen use time.imtconstruction.com on their phone.'); }
  S.me = me;
  await loadRef();
  render();
}
async function loadRef() {
  const [jobs, ccs, emps] = await Promise.all([
    all(() => sb.from('tc_jobs').select('*').order('code')),
    all(() => sb.from('tc_cost_codes').select('*').order('job_code').order('code')),
    all(() => sb.from('tc_employees').select('*').order('code'))]);
  S.jobs = jobs; S.ccs = ccs; S.emps = emps;
}
function renderLogin(msg = '') {
  $root.innerHTML = `<div class="login"><h1>IMT Timeclock · Admin</h1>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
    <label class="f">Employee number</label><input id="code" autocomplete="username" value="${esc(localStorage.getItem('lastCode') || '')}">
    <label class="f">PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password">
    <div id="e"></div>
    <button class="btn primary" style="width:100%;margin-top:16px;padding:11px" id="go">Sign in</button></div>`;
  const go = async () => {
    const code = document.getElementById('code').value.trim(), pin = document.getElementById('pin').value.trim();
    if (!code || !pin) return;
    const { error } = await sb.auth.signInWithPassword({ email: 'e' + code.toLowerCase().replace(/[^a-z0-9]/g, '') + '@imt-timeclock.app', password: pin });
    if (error) return document.getElementById('e').innerHTML = `<div class="err" style="margin-top:12px">Wrong employee number or PIN.</div>`;
    localStorage.setItem('lastCode', code); boot();
  };
  document.getElementById('go').onclick = go;
  document.getElementById('pin').onkeydown = e => { if (e.key === 'Enter') go(); };
  (document.getElementById('code').value ? document.getElementById('pin') : document.getElementById('code')).focus();
}

// ---------- shell ----------
const PAGES = [['dashboard','Dashboard'],['time','Time review'],['payroll','Weekly payroll'],['certified','Certified payroll'],['jobcost','Job cost'],['employees','Employees'],['jobs','Jobs & locations']];
async function render() {
  const { count } = await sb.from('tc_shifts').select('id', { count:'exact', head:true }).neq('status', 'approved').not('clock_out', 'is', null);
  $root.innerHTML = `<div class="layout">
    <aside><div class="brand">IMT Timeclock<small>Admin</small></div>
      <nav>${PAGES.map(([k, l]) => `<a class="${S.page === k ? 'on' : ''}" data-p="${k}">${l}${k === 'time' && count ? `<span class="badge">${count}</span>` : ''}</a>`).join('')}</nav>
      <div class="who">${esc(S.me.first_name)} ${esc(S.me.last_name)} · ${esc(S.me.role)}<br><a id="out">Sign out</a> · <a href="../" target="_blank">Phone app</a></div></aside>
    <main id="main"></main></div>`;
  document.querySelectorAll('[data-p]').forEach(a => a.onclick = () => { S.page = a.dataset.p; S.flash = ''; render(); });
  document.getElementById('out').onclick = async () => { await sb.auth.signOut(); location.reload(); };
  const main = document.getElementById('main');
  try { await PAGE[S.page](main); } catch (e) { main.innerHTML = `<div class="err">${esc(errText(e))}</div>`; }
}
const flash = () => S.flash ? (S.flash.startsWith('!') ? `<div class="err">${esc(S.flash.slice(1))}</div>` : `<div class="msg">${esc(S.flash)}</div>`) : '';
const weekBar = () => `<button class="btn" id="pw">‹ Prev</button><b class="nowrap">Week of ${fDate(S.week)} – ${fDate(addDays(S.week, 6))}</b><button class="btn" id="nw">Next ›</button><button class="btn" id="tw">This week</button>`;
function wireWeek() {
  document.getElementById('pw').onclick = () => { S.week = addDays(S.week, -7); render(); };
  document.getElementById('nw').onclick = () => { S.week = addDays(S.week, 7); render(); };
  document.getElementById('tw').onclick = () => { S.week = weekStart(dstr()); render(); };
}

// ---------- pages ----------
const PAGE = {};

PAGE.dashboard = async main => {
  const today = dstr();
  const [todayRows, open, review] = await Promise.all([
    all(() => sb.from('tc_shifts').select('*').eq('work_date', today)),
    all(() => sb.from('tc_shifts').select('*').is('clock_out', null)),
    all(() => sb.from('tc_shifts').select('*').neq('status', 'approved').not('clock_out', 'is', null))]);
  const onClock = open.filter(s => !s.missed_clockout), missed = open.filter(s => s.missed_clockout);
  const declined = review.filter(s => s.status === 'rejected' || s.worker_response === 'declined');
  const outside = todayRows.filter(s => s.outside_in || s.outside_out || s.outside_checks > 0);
  const people = new Set(todayRows.map(s => s.employee_code));
  const hrs = todayRows.reduce((a, s) => a + (+s.net_hours || 0), 0);
  const byJob = {}; onClock.forEach(s => (byJob[s.job_code] ||= []).push(s));
  main.innerHTML = `<h1>Dashboard</h1><div class="sub">${fDate(today)}</div>${flash()}
    <div class="tiles">
      <div class="tile ok" data-go="time"><div class="n">${onClock.length}</div><div class="l">On the clock now</div></div>
      <div class="tile"><div class="n">${people.size}</div><div class="l">Worked today · ${h(hrs)} hrs</div></div>
      <div class="tile warn" data-go="time"><div class="n">${review.length}</div><div class="l">Shifts to approve</div></div>
      <div class="tile bad" data-go="time"><div class="n">${missed.length}</div><div class="l">Missed clock-outs</div></div>
      <div class="tile bad" data-go="time"><div class="n">${declined.length}</div><div class="l">Declined shifts</div></div>
      <div class="tile warn" data-go="time"><div class="n">${outside.length}</div><div class="l">Outside site today</div></div>
    </div>
    <div class="split">
      <div class="card"><b>On the clock now</b>
        ${Object.keys(byJob).length ? Object.keys(byJob).sort().map(j => `<div style="margin-top:12px"><div class="muted">${esc(jobLabel(j))}</div>
          <table>${byJob[j].map(s => `<tr><td>${esc(s.first_name)} ${esc(s.last_name)}</td><td class="muted">${esc(s.cost_code || '')}</td><td class="nowrap">since ${fTime(s.clock_in)}</td><td>${s.outside_in || s.outside_checks > 0 ? '<span class="tag bad">outside</span>' : ''}</td></tr>`).join('')}</table></div>`).join('') : '<div class="muted" style="margin-top:8px">Nobody is clocked in.</div>'}
        ${missed.length ? `<div style="margin-top:16px"><b class="muted">Missed clock-outs</b><table>${missed.map(s => `<tr><td>${esc(s.first_name)} ${esc(s.last_name)}</td><td>${esc(s.job_code)}</td><td>${fDate(s.work_date)} ${fTime(s.clock_in)}</td><td><button class="btn sm" data-edit="${s.id}">Fix</button></td></tr>`).join('')}</table></div>` : ''}
      </div>
      <div class="card"><b>Where people clocked in today</b><div class="muted" style="margin:4px 0 8px">Circles are job geofences; red pins were outside.</div><div id="dmap"></div></div>
    </div>`;
  main.querySelectorAll('[data-go]').forEach(t => t.onclick = () => { S.page = t.dataset.go; render(); });
  main.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editDialog(missed.find(s => s.id === b.dataset.edit)));
  if (window.L) {
    const map = L.map('dmap').setView([32.95, -96.95], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap' }).addTo(map);
    const pts = [];
    S.jobs.filter(j => j.latitude != null && j.is_active).forEach(j => { L.circle([j.latitude, j.longitude], { radius:j.radius_m, color:'#1f3a5f', weight:1, fillOpacity:.06 }).addTo(map).bindTooltip(`${j.code} – ${j.description}`); });
    todayRows.filter(s => s.in_lat != null).forEach(s => {
      const bad = s.outside_in;
      L.circleMarker([s.in_lat, s.in_lng], { radius:7, color: bad ? '#c5221f' : '#1e8e3e', fillOpacity:.8 }).addTo(map)
        .bindPopup(`<b>${esc(s.first_name)} ${esc(s.last_name)}</b><br>${esc(s.job_code)} ${esc(s.cost_code || '')}<br>In ${fTime(s.clock_in)}${s.in_distance_m != null ? ` · ${fDist(s.in_distance_m)} from job` : ''}`);
      pts.push([s.in_lat, s.in_lng]);
    });
    if (pts.length) map.fitBounds(pts, { padding:[30, 30], maxZoom:15 });
  }
};

PAGE.time = async main => {
  const F = S.filters;
  const rows = await all(() => sb.from('tc_shifts').select('*').eq('week_start', S.week).order('work_date').order('last_name').order('clock_in'));
  const q = F.q.toLowerCase();
  let view = rows.filter(s =>
    (F.status === 'all' || (F.status === 'review' && (needsReview(s) || !s.clock_out)) || (F.status === 'approved' && s.status === 'approved')
      || (F.status === 'declined' && (s.status === 'rejected' || s.worker_response === 'declined'))
      || (F.status === 'outside' && (s.outside_in || s.outside_out || s.outside_checks > 0)) || (F.status === 'missed' && s.missed_clockout))
    && (!F.emp || s.employee_code === F.emp) && (!F.job || s.job_code === F.job)
    && (!q || `${s.first_name} ${s.last_name} ${s.job_code} ${s.cost_code || ''} ${s.cost_code_description || ''}`.toLowerCase().includes(q)));
  const { col, dir } = S.sort;
  view.sort((a, b) => { const x = a[col] ?? '', y = b[col] ?? ''; return (typeof x === 'number' || !isNaN(+x) && !isNaN(+y) && x !== '' ? (+x - +y) : String(x).localeCompare(String(y))) * dir || String(a.clock_in).localeCompare(String(b.clock_in)); });
  const total = view.reduce((a, s) => a + (s.clock_out ? +s.net_hours : 0), 0);
  const empOpts = [...new Map(rows.map(s => [s.employee_code, `${s.last_name}, ${s.first_name}`])).entries()].sort((a, b) => a[1].localeCompare(b[1]));
  const jobOpts = [...new Set(rows.map(s => s.job_code))].sort();
  const th = (c, l, cls = '') => `<th class="sort ${cls}" data-sort="${c}">${l}${col === c ? (dir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  main.innerHTML = `<h1>Time review</h1><div class="sub">Approve, decline or fix shifts. Select rows with the checkboxes, then use the buttons.</div>${flash()}
    <div class="toolbar">${weekBar()}</div>
    <div class="toolbar">
      <select id="fs">${[['review','Needs review'],['all','All shifts'],['approved','Approved'],['declined','Declined'],['outside','Outside site'],['missed','Missed clock-out']].map(([v, l]) => `<option value="${v}" ${F.status === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <select id="fe"><option value="">All employees</option>${empOpts.map(([c, n]) => `<option value="${c}" ${F.emp === c ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
      <select id="fj"><option value="">All jobs</option>${jobOpts.map(j => `<option value="${esc(j)}" ${F.job === j ? 'selected' : ''}>${esc(jobLabel(j))}</option>`).join('')}</select>
      <input id="fq" placeholder="Search name, job, cost code" value="${esc(F.q)}" style="width:220px">
      <span class="grow"></span>
      <span class="muted" id="selc">0 selected</span>
      <button class="btn green" id="apr" disabled>Approve</button><button class="btn red" id="dec" disabled>Decline</button>
      <button class="btn" id="dl">Export CSV</button>
    </div>
    <div class="card" style="padding:0"><div class="scroll"><table>
      <thead><tr><th><input type="checkbox" id="ckall"></th>${th('work_date','Date')}${th('last_name','Employee')}${th('job_code','Job')}${th('cost_code','Cost code')}${th('clock_in','In')}${th('clock_out','Out')}${th('lunch_hours','Lunch','n')}${th('net_hours','Hours','n')}<th>Status / flags</th><th></th></tr></thead>

// ---------- dialogs ----------
const dlg = document.getElementById('dlg');
function openDlg(html, wide = false) { dlg.className = wide ? 'wide' : ''; document.getElementById('dlgBody').innerHTML = html; dlg.showModal(); }
const closeDlg = () => dlg.close();
const dErr = m => { document.getElementById('de').innerHTML = `<div class="err" style="margin-top:10px">${esc(m)}</div>`; };

function reasonDialog(title, label, onOk) {
  openDlg(`<h1>${esc(title)}</h1><label class="f">${esc(label)}</label><input id="rr" style="width:100%" maxlength="200"><div id="de"></div>
    <div class="toolbar" style="margin-top:16px;justify-content:flex-end"><button class="btn" id="c">Cancel</button><button class="btn red" id="ok">Decline</button></div>`);
  document.getElementById('rr').focus();
  document.getElementById('c').onclick = closeDlg;
  document.getElementById('ok').onclick = async () => { const r = document.getElementById('rr').value.trim(); if (!r) return dErr('Enter a reason.'); closeDlg(); await onOk(r); };
}

function editDialog(s) {
  const ccOpts = (job, sel) => { const l = S.ccs.filter(c => c.job_code === job); return l.length ? `<option value="">—</option>` + l.map(c => `<option value="${esc(c.code)}" ${c.code === sel ? 'selected' : ''}>${esc(c.code)} – ${esc(c.description)}</option>`).join('') : ''; };
  openDlg(`<h1>Fix shift</h1><div class="sub">${esc(s.first_name)} ${esc(s.last_name)} · ${fDate(s.work_date)}</div>
    <label class="f">Job</label><select id="ej" style="width:100%">${S.jobs.map(j => `<option value="${esc(j.code)}" ${j.code === s.job_code ? 'selected' : ''}>${esc(j.code)} – ${esc(j.description)}</option>`).join('')}</select>
    <div id="ccw"><label class="f">Cost code</label><select id="ecc" style="width:100%"></select></div>
    <div class="grid2"><div><label class="f">Clock in</label><input type="datetime-local" id="ei" style="width:100%" value="${toLocalInput(s.clock_in)}"></div>
      <div><label class="f">Clock out</label><input type="datetime-local" id="eo" style="width:100%" value="${toLocalInput(s.clock_out)}"></div></div>
    <label class="f">Reason for the change (kept in the history)</label><input id="er" style="width:100%" maxlength="200">
    <div id="de"></div>
    <div class="toolbar" style="margin-top:16px;justify-content:flex-end"><button class="btn" id="c">Cancel</button><button class="btn primary" id="ok">Save</button></div>`);
  const sync = (sel) => { const html = ccOpts(document.getElementById('ej').value, sel); document.getElementById('ecc').innerHTML = html; document.getElementById('ccw').classList.toggle('hide', !html); };
  sync(s.cost_code); document.getElementById('ej').onchange = () => sync('');
  document.getElementById('c').onclick = closeDlg;
  document.getElementById('ok').onclick = async () => {
    const reason = document.getElementById('er').value.trim(); if (!reason) return dErr('Enter a reason.');
    const ci = document.getElementById('ei').value, co = document.getElementById('eo').value;
    if (!ci) return dErr('Clock-in time is required.');
    if (co && new Date(co) < new Date(ci)) return dErr('Clock-out is before clock-in.');
    const hidden = document.getElementById('ccw').classList.contains('hide');
    const { error } = await sb.rpc('tc_edit_entry', { p_id: s.id, p_clock_in: new Date(ci).toISOString(), p_clock_out: co ? new Date(co).toISOString() : null, p_job: document.getElementById('ej').value, p_cost_code: hidden ? null : (document.getElementById('ecc').value || null), p_reason: reason });
    if (error) return dErr(errText(error));
    closeDlg(); S.flash = 'Shift updated. The worker will be asked to review it again.'; render();
  };
}

async function historyDialog(s) {
  const [{ data: edits }, { data: checks }] = await Promise.all([
    sb.from('tc_shift_edits').select('*').eq('entry_id', s.id).order('edited_at'),
    sb.from('tc_location_checks').select('*').eq('entry_id', s.id).order('checked_at')]);
  const mapLink = (lat, lng) => lat != null ? `<a target="_blank" href="https://www.google.com/maps?q=${lat},${lng}">map</a>` : '';
  openDlg(`<h1>Shift history</h1><div class="sub">${esc(s.first_name)} ${esc(s.last_name)} · ${fDate(s.work_date)} · ${esc(s.job_code)} ${esc(s.cost_code || '')}</div>
    <table>
      <tr><td>Clock in</td><td>${fTime(s.clock_in)}</td><td class="muted">${mapLink(s.in_lat, s.in_lng)} ${s.in_distance_m != null ? '· ' + fDist(s.in_distance_m) + ' from job' : s.in_lat != null ? '· job had no location' : ''}</td></tr>
      <tr><td>Clock out</td><td>${fTime(s.clock_out)}</td><td class="muted">${mapLink(s.out_lat, s.out_lng)} ${s.out_distance_m != null ? '· ' + fDist(s.out_distance_m) + ' from job' : ''}</td></tr>
      <tr><td>Hours</td><td colspan="2">${h(s.gross_hours)} − ${h(s.lunch_hours)} lunch = <b>${h(s.net_hours)}</b></td></tr>
      <tr><td>Worker</td><td colspan="2">${s.worker_response ? `${esc(s.worker_response)} ${s.worker_responded_at ? new Date(s.worker_responded_at).toLocaleString('en-US') : ''} ${esc(s.worker_note || '')}` : '<span class="muted">not reviewed yet</span>'}</td></tr>
      <tr><td>Approval</td><td colspan="2">${s.status === 'approved' ? `Approved by ${esc(s.approved_by)} ${new Date(s.approved_at).toLocaleString('en-US')}` : s.status === 'rejected' ? `Declined by ${esc(s.declined_by)}: ${esc(s.decline_reason)}` : '<span class="muted">not approved</span>'}</td></tr>
    </table>
    <h3 style="margin:16px 0 6px">Changes</h3>
    ${(edits || []).length ? `<table><thead><tr><th>When</th><th>By</th><th>Reason</th><th>Before</th><th>After</th></tr></thead><tbody>${edits.map(e => `<tr>
      <td class="nowrap">${new Date(e.edited_at).toLocaleString('en-US')}</td><td>${esc(e.edited_by_name)}</td><td>${esc(e.reason)}</td>
      <td class="muted nowrap">${fTime(e.old_clock_in)}–${fTime(e.old_clock_out)}<br>${esc(e.old_job || '')} ${esc(e.old_cost_code || '')}</td>
      <td class="nowrap">${fTime(e.new_clock_in)}–${fTime(e.new_clock_out)}<br>${esc(e.new_job || '')} ${esc(e.new_cost_code || '')}</td></tr>`).join('')}</tbody></table>` : '<div class="muted">No changes.</div>'}
    <h3 style="margin:16px 0 6px">Location checks while clocked in</h3>
    ${(checks || []).length ? `<table><tbody>${checks.map(c => `<tr><td class="nowrap">${new Date(c.checked_at).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' })}</td><td>${c.distance_m != null ? fDist(c.distance_m) + ' from job' : ''}</td><td>${c.outside ? '<span class="tag warn">outside</span>' : '<span class="tag ok">on site</span>'}</td><td>${mapLink(c.lat, c.lng)}</td></tr>`).join('')}</tbody></table>` : '<div class="muted">None recorded (only taken when the worker opens the app).</div>'}
    <div class="toolbar" style="margin-top:16px;justify-content:flex-end"><button class="btn" id="c">Close</button></div>`, true);
  document.getElementById('c').onclick = closeDlg;
}

function pinDialog(code) {
  const e = S.emps.find(x => x.code === code);
  openDlg(`<h1>${e.has_pin ? 'Reset' : 'Set'} PIN</h1><div class="sub">${esc(e.first_name)} ${esc(e.last_name)} · ${esc(code)}</div>
    <label class="f">New 6-digit PIN</label><div class="toolbar"><input id="pp" inputmode="numeric" maxlength="6" style="width:140px;font-size:20px;letter-spacing:4px"><button class="btn" id="gen">Random</button></div>
    <div class="muted">Give the PIN to the employee in person. They sign in with employee number ${esc(code)} and this PIN.</div><div id="de"></div>
    <div class="toolbar" style="margin-top:16px;justify-content:flex-end"><button class="btn" id="c">Cancel</button><button class="btn primary" id="ok">Save PIN</button></div>`);
  document.getElementById('gen').onclick = () => { const a = new Uint32Array(1); crypto.getRandomValues(a); document.getElementById('pp').value = String(a[0] % 1000000).padStart(6, '0'); };
  document.getElementById('c').onclick = closeDlg;
  document.getElementById('ok').onclick = async () => {
    const pin = document.getElementById('pp').value.trim(); if (!/^\d{6}$/.test(pin)) return dErr('PIN must be 6 digits.');
    const { error } = await sb.rpc('tc_set_pin', { p_code: code, p_pin: pin });
    if (error) return dErr(errText(error));
    closeDlg(); S.flash = `PIN saved for ${e.first_name} ${e.last_name} (${code}).`; render();
  };
}

function addEmployeeDialog() {
  openDlg(`<h1>Add employee</h1>
    <div class="grid2"><div><label class="f">Employee # (same as ComputerEase)</label><input id="ac" style="width:100%"></div><div><label class="f">Role</label><select id="ar" style="width:100%"><option>worker</option><option>foreman</option><option>office</option><option>admin</option></select></div>
    <div><label class="f">First name</label><input id="af" style="width:100%"></div><div><label class="f">Last name</label><input id="al" style="width:100%"></div>
    <div><label class="f">Language</label><select id="ag" style="width:100%"><option value="es">Spanish</option><option value="en">English</option></select></div></div>
    <div id="de"></div>
    <div class="toolbar" style="margin-top:16px;justify-content:flex-end"><button class="btn" id="c">Cancel</button><button class="btn primary" id="ok">Add</button></div>`);
  document.getElementById('c').onclick = closeDlg;
  document.getElementById('ok').onclick = async () => {
    const v = id => document.getElementById(id).value.trim();
    if (!v('ac') || !v('af') || !v('al')) return dErr('Fill in employee #, first and last name.');
    const { error } = await sb.rpc('tc_add_employee', { p_code: v('ac'), p_first: v('af'), p_last: v('al'), p_role: v('ar'), p_language: v('ag') });
    if (error) return dErr(/duplicate|unique/i.test(error.message) ? 'That employee number already exists.' : errText(error));
    closeDlg(); S.flash = `Added ${v('af')} ${v('al')}. Set a PIN so they can sign in.`; render();
  };
}

function addJobDialog() {
  openDlg(`<h1>Add job</h1>
    <div class="grid2"><div><label class="f">Job # (same as ComputerEase)</label><input id="jc" style="width:100%"></div><div><label class="f">Certified payroll?</label><select id="jt" style="width:100%"><option value="0">No</option><option value="1">Yes (TxDOT / prevailing wage)</option></select></div></div>
    <label class="f">Job name</label><input id="jd" style="width:100%">
    <div id="de"></div>
    <div class="toolbar" style="margin-top:16px;justify-content:flex-end"><button class="btn" id="c">Cancel</button><button class="btn primary" id="ok">Add job</button></div>`);
  document.getElementById('c').onclick = closeDlg;
  document.getElementById('ok').onclick = async () => {
    const c = document.getElementById('jc').value.trim(), d = document.getElementById('jd').value.trim();
    if (!c || !d) return dErr('Fill in job # and name.');
    const { error } = await sb.rpc('tc_add_job', { p_code: c, p_description: d, p_certified: document.getElementById('jt').value === '1' });
    if (error) return dErr(/duplicate|unique/i.test(error.message) ? 'That job number already exists.' : errText(error));
    closeDlg(); S.flash = `Added job ${c}. Set its location and cost codes next.`; render();
  };
}

function costCodeDialog(job) {
  const list = S.ccs.filter(c => c.job_code === job);
  openDlg(`<h1>Cost codes</h1><div class="sub">${esc(jobLabel(job))}</div>
    <div class="toolbar"><input id="nc" placeholder="Code e.g. 1000.0010" style="width:160px"><input id="nd" placeholder="Description" style="flex:1"><button class="btn primary" id="addc">Add</button></div>
    <div id="de"></div>
    <div style="max-height:55vh;overflow:auto"><table><thead><tr><th>Code</th><th>Description</th><th>Unit</th><th>Active</th></tr></thead>
      <tbody>${list.map(c => `<tr><td>${esc(c.code)}</td><td>${esc(c.description)}</td><td>${esc(c.unit || '')}</td><td><input type="checkbox" data-cca="${esc(c.code)}" ${c.is_active ? 'checked' : ''}></td></tr>`).join('') || '<tr><td colspan="4" class="muted">No cost codes. Crews clock in to this job without one.</td></tr>'}</tbody></table></div>
    <div class="toolbar" style="margin-top:16px;justify-content:flex-end"><button class="btn" id="c">Close</button></div>`, true);
  document.getElementById('c').onclick = () => { closeDlg(); render(); };
  document.getElementById('addc').onclick = async () => {
    const c = document.getElementById('nc').value.trim(), d = document.getElementById('nd').value.trim(); if (!c || !d) return dErr('Enter a code and description.');
    const { error } = await sb.rpc('tc_add_cost_code', { p_job: job, p_code: c, p_description: d });
    if (error) return dErr(errText(error));
    await loadRef(); costCodeDialog(job);
  };
  dlg.querySelectorAll('[data-cca]').forEach(cb => cb.onchange = async () => {
    const { error } = await sb.rpc('tc_set_cost_code_active', { p_job: job, p_code: cb.dataset.cca, p_active: cb.checked });
    if (error) dErr(errText(error)); else { const x = S.ccs.find(c => c.job_code === job && c.code === cb.dataset.cca); if (x) x.is_active = cb.checked; }
  });
}

function locationDialog(job) {
  openDlg(`<h1>Job location</h1><div class="sub">${esc(job.code)} – ${esc(job.description)}</div>
    <div class="toolbar"><input id="addr" placeholder="Search an address, intersection or town" style="flex:1"><button class="btn" id="go">Search</button></div>
    <div class="muted" style="margin-bottom:6px">Search, then click the map to place the center of the site. Drag the radius to cover the work area.</div>
    <div id="lmap" style="height:420px;border-radius:10px"></div>
    <div class="toolbar" style="margin-top:10px"><label class="muted">Radius</label><input id="rad" type="range" min="100" max="15840" step="50" style="flex:1"><input id="radn" type="number" style="width:90px"> <span class="muted">ft</span></div>
    <div id="de"></div>
    <div class="toolbar" style="margin-top:12px;justify-content:flex-end"><button class="btn" id="c">Cancel</button><button class="btn primary" id="ok">Save location</button></div>`, true);
  if (!window.L) return dErr('The map could not load. Check the internet connection and reload the page.');
  const ft0 = Math.round((job.radius_m || 300) * 3.28084);
  document.getElementById('rad').value = document.getElementById('radn').value = ft0;
  const start = job.latitude != null ? [job.latitude, job.longitude] : [32.95, -96.95];
  const map = L.map('lmap').setView(start, job.latitude != null ? 15 : 9);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap' }).addTo(map);
  let pos = job.latitude != null ? L.latLng(job.latitude, job.longitude) : null, mk = null, ci = null;
  const radM = () => Math.max(30, Math.round((+document.getElementById('radn').value || 1000) / 3.28084));
  const draw = () => { if (!pos) return; mk ? mk.setLatLng(pos) : (mk = L.marker(pos, { draggable:true }).addTo(map)).on('dragend', e => { pos = e.target.getLatLng(); draw(); }); ci ? ci.setLatLng(pos).setRadius(radM()) : ci = L.circle(pos, { radius:radM(), color:'#1f3a5f' }).addTo(map); };
  draw();
  map.on('click', e => { pos = e.latlng; draw(); });
  document.getElementById('rad').oninput = e => { document.getElementById('radn').value = e.target.value; draw(); };
  document.getElementById('radn').oninput = e => { document.getElementById('rad').value = e.target.value; draw(); };
  const search = async () => {
    const q = document.getElementById('addr').value.trim(); if (!q) return;
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q=${encodeURIComponent(q)}`).then(r => r.json()).catch(() => []);
    if (!r[0]) return dErr('Address not found — try a nearby town or intersection, then click the map.');
    document.getElementById('de').innerHTML = '';
    pos = L.latLng(+r[0].lat, +r[0].lon); map.setView(pos, 16); draw();
  };
  document.getElementById('go').onclick = search;
  document.getElementById('addr').onkeydown = e => { if (e.key === 'Enter') search(); };
  setTimeout(() => map.invalidateSize(), 150);
  document.getElementById('c').onclick = closeDlg;
  document.getElementById('ok').onclick = async () => {
    if (!pos) return dErr('Click the map to place the job location.');
    const { error } = await sb.rpc('tc_set_job_location', { p_job: job.code, p_lat: pos.lat, p_lng: pos.lng, p_radius_m: Math.min(20000, Math.max(50, radM())) });
    if (error) return dErr(errText(error));
    closeDlg(); S.flash = `Location saved for job ${job.code}.`; render();
  };
}

boot();
</script>
