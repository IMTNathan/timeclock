<title>IMT Timeclock</title>
<style>

  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:#111; -webkit-tap-highlight-color:transparent; }
  header { background:var(--navy); color:#fff; padding:calc(env(safe-area-inset-top) + 12px) 16px 12px; display:flex; align-items:center; gap:10px; }

  header button { flex:none; white-space:nowrap; }
  header img { flex:none; }
  .pics { display:flex; gap:8px; margin-top:8px; }
  .pics figure { margin:0; text-align:center; }
  .pics img { width:84px; height:84px; object-fit:cover; border-radius:8px; border:1px solid var(--line); display:block; }
  .pics img.big { width:min(300px, 70vw); height:auto; }
  .pics figcaption { font-size:11px; color:var(--muted); }
  header img { height:30px; width:auto; display:block; }
  .brandbox { background:#000; border-radius:14px; padding:22px 16px; margin-bottom:14px; text-align:center; }
  .brandbox img { width:min(260px, 78%); height:auto; }
  header button { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.5); border-radius:8px; padding:6px 10px; font-size:14px; }
  nav { display:flex; background:#fff; border-bottom:1px solid var(--line); }
  nav button { flex:1; padding:12px 4px; border:0; background:none; font-size:15px; color:var(--muted); border-bottom:3px solid transparent; }
  nav button.on { color:var(--navy); border-bottom-color:var(--navy); font-weight:600; }
  main { padding:16px; max-width:900px; margin:0 auto; padding-bottom:calc(env(safe-area-inset-bottom) + 40px); }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .big { width:100%; border:0; border-radius:16px; padding:28px 10px; font-size:26px; font-weight:700; color:#fff; }
  .big.in { background:var(--green); } .big.out { background:var(--red); }
  .big:disabled { opacity:.5; }
  .btn { border:1px solid var(--line); background:#fff; color:#111; border-radius:10px; padding:10px 14px; font-size:15px; }
  .btn.primary { background:var(--navy); color:#fff; border-color:var(--navy); }
  .btn.green { background:var(--green); color:#fff; border-color:var(--green); }
  .btn.red { background:var(--red); color:#fff; border-color:var(--red); }
  .shift { display:flex; gap:12px; padding:12px 0; border-top:1px solid var(--line); }
  .shift:first-child { border-top:0; }
  .shift .body { flex:1; min-width:0; }
  .shift .hrs { font-size:20px; font-weight:700; white-space:nowrap; }
  label { display:block; font-size:14px; color:var(--muted); margin:10px 0 4px; }
  input, select { color:#111; width:100%; font-size:18px; padding:12px; border:1px solid #bdbdbd; border-radius:10px; background:#fff; }
  .muted { color:var(--muted); font-size:14px; }
  .status { font-size:20px; font-weight:600; margin:4px 0; }
  .timer { font-size:40px; font-weight:700; font-variant-numeric:tabular-nums; margin:6px 0 12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .row > * { flex:1; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .tag { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; background:#ededed; color:var(--muted); }
  .tag.ok { background:#e6f4ea; color:var(--green); } .tag.warn { background:#fef0e0; color:var(--amber); } .tag.bad { background:#fce8e6; color:var(--red); }
  .err { background:#fce8e6; color:var(--red); padding:10px 12px; border-radius:10px; margin:10px 0; }
  .msg { background:#e6f4ea; color:var(--green); padding:10px 12px; border-radius:10px; margin:10px 0; }
  .keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px; }
  .keypad button { font-size:26px; padding:16px 0; border-radius:12px; border:1px solid var(--line); background:#fff; color:#111; }
  .dots { display:flex; justify-content:center; gap:12px; margin:14px 0 4px; }
  .dots span { width:16px; height:16px; border-radius:50%; border:2px solid var(--navy); }
  .dots span.f { background:var(--navy); }
  .scroll { overflow-x:auto; }
  dialog { border:0; border-radius:14px; padding:18px; width:min(94vw,440px); }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  .hide { display:none !important; }
  .subtabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .subtabs button { border:1px solid var(--line); background:#fff; color:#111; border-radius:999px; padding:7px 12px; font-size:14px; }
  .subtabs button.on { background:var(--navy); color:#fff; border-color:var(--navy); }
</style>

function weekStart(ds) { const d = new Date(ds + 'T12:00:00'); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); return todayStr(d); }

async function reloadJobs() { const { data } = await sb.from('tc_jobs').select('*').order('code'); S.jobs = data || []; }

function outsideMsg(rows, field) {

  return (j && d != null && d > j.radius_m) ? ' — ' + T[lang].outsideNote(fmtDist(d)) : '';

// ---------------- punch security: one phone per employee, and a photo at every punch ----------------
// The phone's id is a random value kept in this browser. The server registers it to the employee on the first punch.
function deviceId() {
  try {
    let d = localStorage.getItem('tcDevice');
    if (!d) {
      d = crypto.randomUUID ? crypto.randomUUID() : Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
      localStorage.setItem('tcDevice', d);
      if (localStorage.getItem('tcDevice') !== d) return null;
    }
    return d;
  } catch (e) { return null; }
}
// Shrinks the camera picture to a small JPEG (longest side 480 px) so it uploads quickly on a weak signal.
async function shrinkPhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const k = Math.min(1, 480 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.6).split(',')[1];
  } finally { URL.revokeObjectURL(url); }
}
// Opens the phone's camera. Must be called straight from a tap. A picture older than 3 minutes is refused (it came from the gallery, not the camera).
function takePhoto() {
  return new Promise(res => {
    const inp = document.getElementById('cam'); inp.value = '';
    let done = false; const fin = v => { if (!done) { done = true; res(v); } };
    inp.onchange = async () => {
      const f = inp.files && inp.files[0]; if (!f) return fin({ cancel: true });
      if (Date.now() - f.lastModified > 3 * 60 * 1000) return fin({ old: true });
      try { fin({ b64: await shrinkPhoto(f) }); } catch (e) { fin({ bad: true }); }
    };
    inp.oncancel = () => fin({ cancel: true });
    inp.click();
  });
}
function busy(btn, on) { if (btn) { btn.disabled = on; if (on) btn.textContent = t('gettingGps'); } }
function noLoc(btn, label, g) { busy(btn, false); btn.textContent = label; document.getElementById('e').innerHTML = locErrHtml(g); }
function showErr(m) { const e = document.getElementById('e'); if (e) e.innerHTML = `<div class="err">${esc(m)}</div>`; }
// Photo first (the camera has to open straight from the tap), then location.
async function punchExtras(btn, label) {
  let photo = null;
  if (S.settings && S.settings.require_photo) {
    const p = await takePhoto();
    if (p.cancel) return null;
    if (p.old || p.bad) { showErr(t(p.old ? 'photoOld' : 'photoBad')); return null; }
    photo = p.b64;
  }
  busy(btn, true);
  const g = await getGps();
  if (g.lat == null) { noLoc(btn, label, g); return null; }
  return { g, photo };
}
function punchErr(btn, label, error) {
  busy(btn, false); btn.textContent = label;
  if (String(error && error.message).includes('photo_required')) (S.settings = S.settings || {}).require_photo = true;
  showErr(errText(error));
}
// Error box for a punch with no location. iPhone home-screen web apps get their own fix; the small last line is for troubleshooting.
function locErrHtml(g) {
  g = g || {};
  const home = navigator.standalone === true;
  const where = home ? 'iPhone home screen' : (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches ? 'installed app' : 'browser');
  const detail = `${where} · ${g.code ? 'code ' + g.code : 'no code'}${g.msg ? ' · ' + esc(String(g.msg).slice(0, 80)) : ''}`;
  return `<div class="err"><b>${t('location_required')}</b><br>${t(home && g.denied ? 'locHome' : g.denied ? 'locHelp' : 'locSlow')}<div style="font-size:11px;opacity:.7;margin-top:6px">${detail}</div></div>`;
}
async function getGps() {
  if (!navigator.geolocation) return {};
  const once = opts => new Promise(res => navigator.geolocation.getCurrentPosition(
    p => res({ lat: p.coords.latitude, lng: p.coords.longitude }), e => res({ denied: e && e.code === 1, code: e && e.code, msg: e && e.message }), opts));
  let g = await once({ enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
  // no precise fix (indoors, weak GPS): fall back to the phone's rough location instead of blocking the punch
  if (g.lat == null && !g.denied) g = await once({ enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 });
  return g;
}
// In-app question box (replaces the phone's own pop-ups, which some phones suppress)
function ask({ title, label = '', input = null, okText, danger = false, emptyMsg }) {
  return new Promise(resolve => {
    const dlg = document.getElementById('dlg');
    document.getElementById('dlgBody').innerHTML = `
      <div class="status">${esc(title)}</div>
      ${input ? `<label>${esc(label)}</label><input id="askIn" ${input === 'pin' ? 'inputmode="numeric" maxlength="4" autocomplete="off"' : 'maxlength="200"'}>` : (label ? `<div class="muted" style="margin-top:6px">${esc(label)}</div>` : '')}
      <div id="askErr"></div>
      <div class="row" style="margin-top:16px"><button class="btn" id="askNo">${t('cancel')}</button><button class="btn ${danger ? 'red' : 'primary'}" id="askOk">${esc(okText || t('yes'))}</button></div>`;
    let settled = false;
    const done = v => { if (settled) return; settled = true; if (dlg.open) dlg.close(); resolve(v); };
    dlg.oncancel = () => done(null);
    document.getElementById('askNo').onclick = () => done(null);
    document.getElementById('askOk').onclick = () => {
      if (!input) return done(true);
      const v = document.getElementById('askIn').value.trim();
      if (!v) return document.getElementById('askErr').innerHTML = `<div class="err">${esc(emptyMsg || t('reasonReq'))}</div>`;
      done(v);
    };
    dlg.showModal();
    if (input) document.getElementById('askIn').focus();
  });
}

    if (g.lat == null) { e.target.disabled = false; e.target.textContent = t('setLocHere'); return document.getElementById('e').innerHTML = locErrHtml(g); }
    const { error } = await sb.rpc('tc_set_job_location', { p_job: job, p_lat: g.lat, p_lng: g.lng });

    await reloadJobs(); renderCrew(t('locSaved'));
  };
  const dec = document.getElementById('dec');
  if (dec) dec.onclick = async () => {
    const ids = [...document.querySelectorAll('.ck:checked')].map(c => c.value); if (!ids.length) return;
    const reason = await ask({ title: t('decline'), label: t('declineReasonLead'), input: 'text', okText: t('decline'), danger: true });
    if (!reason) return;
    const { data: n, error } = await sb.rpc('tc_decline', { p_ids: ids, p_reason: reason });
    if (error) return document.getElementById('e').innerHTML = `<div class="err">${esc(errText(error))}</div>`;

  };
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editDialog(rows.find(r => r.id === b.dataset.edit), () => renderCrew(t('saved'))));
  document.querySelectorAll('.pics img').forEach(i => i.onclick = () => i.classList.toggle('big'));
}

async function addShiftDialog(after) {
  const { data: emps } = await sb.from('tc_employees').select('*').eq('is_active', true).order('last_name');
  const list = (emps || []).filter(e => !e.is_breakglass && (isOffice() || e.code !== S.me.code)).sort((a, b) => (a.last_name + a.first_name).localeCompare(b.last_name + b.first_name));
  const dlg = document.getElementById('dlg');
  document.getElementById('dlgBody').innerHTML = `
    <div class="status">${t('addShift')}</div><div class="muted">${t('addShiftHelp')}</div>
    <label>${t('employee')}</label><select id="nsEmp"><option value="">—</option>${list.map(e => `<option value="${esc(e.code)}">${esc(e.last_name)}, ${esc(e.first_name)} (${esc(e.code)})</option>`).join('')}</select>
    <label>${t('job')}</label><select id="nsJob">${S.jobs.filter(j => j.is_active).map(j => `<option value="${esc(j.code)}" ${j.code === S.myOpenJob ? 'selected' : ''}>${esc(j.code)} – ${esc(j.description)}</option>`).join('')}</select>
    <div id="nsCcWrap" class="hide"><label>${t('costCode')}</label><select id="nsCc"></select></div>
    <label>${t('date')}</label><input type="date" id="nsDate" value="${S.crewDate}" max="${todayStr()}">
    <div class="row"><div><label>${t('in')}</label><input type="time" id="nsIn" value="07:00"></div><div><label>${t('out')}</label><input type="time" id="nsOut" value="17:30"></div></div>
    <label>${t('reason')}</label><input id="nsReason" maxlength="200">
    <div id="nsErr"></div>
    <div class="row" style="margin-top:14px"><button class="btn" id="nsCancel">${t('cancel')}</button><button class="btn primary" id="nsSave">${t('save')}</button></div>`;
  dlg.showModal();
  const $ = id => document.getElementById(id), bad = m => $('nsErr').innerHTML = `<div class="err">${esc(m)}</div>`;
  wireCostCode($('nsJob'), $('nsCc'), $('nsCcWrap'), '');
  $('nsCancel').onclick = () => dlg.close();
  $('nsSave').onclick = async () => {
    const emp = $('nsEmp').value, job = $('nsJob').value, reason = $('nsReason').value.trim(), d = $('nsDate').value;
    if (!emp) return bad(t('employee') + '?');
    if (!reason) return bad(t('reasonReq'));
    if (!d || !$('nsIn').value || !$('nsOut').value) return bad(t('bad_times'));
    const cin = new Date(`${d}T${$('nsIn').value}`); let cout = new Date(`${d}T${$('nsOut').value}`);
    if (cout <= cin) cout = new Date(cout.getTime() + 24 * 3600e3);   // night shift that ends the next morning
    const cc = $('nsCcWrap').classList.contains('hide') ? null : ($('nsCc').value || null);
    const { error } = await sb.rpc('tc_add_entry', { p_employee: emp, p_job: job, p_cost_code: cc, p_clock_in: cin.toISOString(), p_clock_out: cout.toISOString(), p_reason: reason });
    if (error) return bad(errText(error));
    dlg.close(); after();
  };
}

function editDialog(s, after) {
  const dlg = document.getElementById('dlg');
  const jobOpts = S.jobs.map(j => `<option value="${esc(j.code)}" ${j.code === s.job_code ? 'selected' : ''}>${esc(j.code)} – ${esc(j.description)}</option>`).join('');
  document.getElementById('dlgBody').innerHTML = `
    <div class="status">${esc(s.first_name)} ${esc(s.last_name)}</div>
    <label>${t('job')}</label><select id="ej">${jobOpts}</select>
    <div id="ecw" class="hide"><label>${t('costCode')}</label><select id="ecc"></select></div>
    <label>${t('in')}</label><input type="datetime-local" id="ei" value="${toLocalInput(s.clock_in)}">
    <label>${t('out')}</label><input type="datetime-local" id="eo" value="${toLocalInput(s.clock_out)}">
    <label>${t('reason')}</label><input id="er" maxlength="200">
    <div id="ee"></div>
    <div class="row" style="margin-top:14px"><button class="btn" id="ec">${t('cancel')}</button><button class="btn primary" id="es">${t('save')}</button></div>`;
  dlg.showModal();
  wireCostCode(document.getElementById('ej'), document.getElementById('ecc'), document.getElementById('ecw'), s.cost_code || '', false);
  document.getElementById('ec').onclick = () => dlg.close();
  document.getElementById('es').onclick = async () => {

    const ci = document.getElementById('ei').value, co = document.getElementById('eo').value;
    const { error } = await sb.rpc('tc_edit_entry', { p_id: s.id, p_clock_in: new Date(ci).toISOString(), p_clock_out: co ? new Date(co).toISOString() : null, p_job: document.getElementById('ej').value, p_cost_code: (document.getElementById('ecw').classList.contains('hide') ? null : (document.getElementById('ecc').value || null)), p_reason: reason });
    if (error) return document.getElementById('ee').innerHTML = `<div class="err">${esc(errText(error))}</div>`;
    dlg.close(); after();
  };
}

// ---------------- office ----------------
function csv(rows, cols, name) {
  const body = [cols.map(c => c[1]).join(','), ...rows.map(r => cols.map(c => `"${String(r[c[0]] ?? '').replace(/"/g, '""')}"`).join(','))].join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], { type: 'text/csv' })); a.download = name; a.click();
}

    const pin = await ask({ title: `${b.dataset.pin} — ${t('setPin')}`, label: t('newPin'), input: 'pin', okText: t('save'), emptyMsg: t('pin_must_be_4_digits') });
    if (!pin) return;
    const { error } = await sb.rpc('tc_set_pin', { p_code: b.dataset.pin, p_pin: pin });
    error ? err(errText(error)) : renderOffice(t('pinSaved'));
  });
}

// ---------------- job location map (office) ----------------
async function loadLeaflet() {
  if (window.L) return;
  const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'vendor/leaflet/leaflet.css'; document.head.appendChild(css);
  await new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'vendor/leaflet/leaflet.js'; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
}
async function mapDialog(job) {
  const dlg = document.getElementById('dlg');
  document.getElementById('dlgBody').innerHTML = `
    <div class="status">${esc(job.code)} – ${esc(job.description)}</div>
    <div class="muted">${t('mapHelp')}</div>
    <div class="row" style="margin-top:8px"><input id="addr" placeholder="${t('searchAddr')}"><button class="btn" id="go" style="flex:0">🔍</button></div>
    <div id="map" style="height:300px;border-radius:10px;margin-top:8px;background:#e8ebef"></div>
    <label>${t('radius')}</label><input id="rad" type="number" inputmode="numeric" value="${Math.round((job.radius_m || 300) * 3.28084)}">
    <div id="me"></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="mc">${t('cancel')}</button><button class="btn primary" id="ms">${t('save')}</button></div>`;
  dlg.showModal();
  document.getElementById('mc').onclick = () => dlg.close();
  try { await loadLeaflet(); } catch { document.getElementById('me').innerHTML = `<div class="err">${t('noSignal')}</div>`; return; }
  const start = job.latitude != null ? [job.latitude, job.longitude] : [33.0, -96.9];
  const map = L.map('map').setView(start, job.latitude != null ? 16 : 9);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
  let pos = job.latitude != null ? { lat: job.latitude, lng: job.longitude } : null, marker = null, circle = null;
  const radM = () => Math.max(50, Math.round((+document.getElementById('rad').value || 1000) / 3.28084));
  const draw = () => { if (!pos) return; marker ? marker.setLatLng(pos) : marker = L.marker(pos).addTo(map); circle ? circle.setLatLng(pos).setRadius(radM()) : circle = L.circle(pos, { radius: radM(), color: '#000' }).addTo(map); };
  draw();
  map.on('click', e => { pos = e.latlng; draw(); });
  document.getElementById('rad').oninput = draw;
  const search = async () => {
    const q = document.getElementById('addr').value.trim(); if (!q) return;
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q=${encodeURIComponent(q)}`).then(r => r.json()).catch(() => []);
    if (r[0]) { pos = { lat: +r[0].lat, lng: +r[0].lon }; map.setView(pos, 16); draw(); }
  };
  document.getElementById('go').onclick = search;
  document.getElementById('addr').onkeydown = e => { if (e.key === 'Enter') search(); };
  setTimeout(() => map.invalidateSize(), 200);
  document.getElementById('ms').onclick = async () => {
    if (!pos) return;
    const { error } = await sb.rpc('tc_set_job_location', { p_job: job.code, p_lat: pos.lat, p_lng: pos.lng, p_radius_m: Math.min(20000, radM()) });
    if (error) return document.getElementById('me').innerHTML = `<div class="err">${esc(errText(error))}</div>`;
    dlg.close(); await reloadJobs(); renderOffice(t('locSaved'));
  };
}

// ---------------- start ----------------
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') { S.me = null; render(); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.me) render(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
await loadMe();
render();
</script>
