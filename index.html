<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IMT Reloj">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>IMT Timeclock</title>
<style>
  :root { --navy:#1f3a5f; --green:#1e8e3e; --red:#c5221f; --amber:#b06000; --bg:#f3f4f6; --card:#fff; --line:#e2e5ea; --muted:#5f6b7a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:#111; -webkit-tap-highlight-color:transparent; }
  header { background:var(--navy); color:#fff; padding:calc(env(safe-area-inset-top) + 12px) 16px 12px; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:18px; margin:0; flex:1; }
  header button { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.5); border-radius:8px; padding:6px 10px; font-size:14px; }
  nav { display:flex; background:#fff; border-bottom:1px solid var(--line); }
  nav button { flex:1; padding:12px 4px; border:0; background:none; font-size:15px; color:var(--muted); border-bottom:3px solid transparent; }
  nav button.on { color:var(--navy); border-bottom-color:var(--navy); font-weight:600; }
  main { padding:16px; max-width:900px; margin:0 auto; padding-bottom:calc(env(safe-area-inset-bottom) + 40px); }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .big { width:100%; border:0; border-radius:16px; padding:28px 10px; font-size:26px; font-weight:700; color:#fff; }
  .big.in { background:var(--green); } .big.out { background:var(--red); }
  .big:disabled { opacity:.5; }
  .btn { border:1px solid var(--line); background:#fff; border-radius:10px; padding:10px 14px; font-size:15px; }
  .btn.primary { background:var(--navy); color:#fff; border-color:var(--navy); }
  .btn.green { background:var(--green); color:#fff; border-color:var(--green); }
  label { display:block; font-size:14px; color:var(--muted); margin:10px 0 4px; }
  input, select { width:100%; font-size:18px; padding:12px; border:1px solid #c9ced6; border-radius:10px; background:#fff; }
  .muted { color:var(--muted); font-size:14px; }
  .status { font-size:20px; font-weight:600; margin:4px 0; }
  .timer { font-size:40px; font-weight:700; font-variant-numeric:tabular-nums; margin:6px 0 12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .row > * { flex:1; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .tag { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; background:#eef1f5; color:var(--muted); }
  .tag.ok { background:#e6f4ea; color:var(--green); } .tag.warn { background:#fef0e0; color:var(--amber); } .tag.bad { background:#fce8e6; color:var(--red); }
  .err { background:#fce8e6; color:var(--red); padding:10px 12px; border-radius:10px; margin:10px 0; }
  .msg { background:#e6f4ea; color:var(--green); padding:10px 12px; border-radius:10px; margin:10px 0; }
  .keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px; }
  .keypad button { font-size:26px; padding:16px 0; border-radius:12px; border:1px solid var(--line); background:#fff; }
  .dots { display:flex; justify-content:center; gap:12px; margin:14px 0 4px; }
  .dots span { width:16px; height:16px; border-radius:50%; border:2px solid var(--navy); }
  .dots span.f { background:var(--navy); }
  .scroll { overflow-x:auto; }
  dialog { border:0; border-radius:14px; padding:18px; width:min(94vw,440px); }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  .hide { display:none !important; }
  .subtabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .subtabs button { border:1px solid var(--line); background:#fff; border-radius:999px; padding:7px 12px; font-size:14px; }
  .subtabs button.on { background:var(--navy); color:#fff; border-color:var(--navy); }
</style>
</head>
<body>
<header>
  <h1 id="title">IMT</h1>
  <button id="langBtn" onclick="toggleLang()">EN</button>
  <button id="logoutBtn" class="hide" onclick="logout()"></button>
</header>
<nav id="tabs" class="hide"></nav>
<main id="app"></main>

<dialog id="dlg"><div id="dlgBody"></div></dialog>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';

const SUPABASE_URL = 'https://qjruoobyecsgxxgxbkja.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-KhWyifowntUK9kRHHGCxA_mOfuWMxA';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

// ---------------- text ----------------
const T = {
  es: {
    appTitle:'IMT Reloj', empNum:'Número de empleado', pin:'PIN (6 dígitos)', signIn:'Entrar', next:'Siguiente', back:'Atrás',
    badLogin:'Número o PIN incorrecto.', logout:'Salir', clock:'Reloj', crew:'Cuadrilla', office:'Oficina',
    clockedOut:'Fuera del reloj', clockedIn:'En el reloj', since:'Desde', job:'Trabajo', pickJob:'Escoja el trabajo',
    clockIn:'ENTRADA', clockOut:'SALIDA', changeJob:'Cambiar de trabajo', thisWeek:'Esta semana', hours:'horas',
    lunchNote:'Se descuenta 1 hora de almuerzo por día.', gettingGps:'Buscando ubicación…', done:'Listo',
    confirmOut:'¿Marcar salida ahora?', yes:'Sí', no:'No', cancel:'Cancelar', save:'Guardar',
    date:'Fecha', name:'Nombre', in:'Entrada', out:'Salida', total:'Total', lunch:'Almuerzo', status:'Estado',
    approve:'Aprobar', approveAll:'Aprobar todo', approved:'Aprobado', submitted:'Por aprobar', open:'Abierto', missed:'Olvidó salida',
    nothing:'No hay horas para este día.', edit:'Corregir', reason:'Razón del cambio', reasonReq:'Escriba la razón.',
    selectAll:'Seleccionar', week:'Semana', reg:'Regular', ot:'Extra', unapproved:'Sin aprobar',
    payroll:'Nómina', certified:'Nómina certificada', pending:'Por aprobar', employees:'Empleados', jobs:'Trabajos',
    download:'Descargar CSV', setPin:'Poner PIN', role:'Puesto', language:'Idioma', active:'Activo', hasPin:'Tiene PIN',
    newPin:'PIN nuevo (6 dígitos)', pinSaved:'PIN guardado.', saved:'Guardado.', certifiedQ:'Nómina certificada',
    prev:'‹ Anterior', nextW:'Siguiente ›', noSignal:'Sin señal. Intente de nuevo cuando tenga señal.',
    already_clocked_in:'Ya está en el reloj.', not_clocked_in:'No está en el reloj.', job_not_active:'Ese trabajo no está activo.',
    not_an_employee:'Su usuario no está activo. Hable con la oficina.', not_allowed:'No tiene permiso.',
    pin_must_be_6_digits:'El PIN debe tener 6 números.', reason_required:'Escriba la razón.',
    worker:'Trabajador', foreman:'Capataz', officeRole:'Oficina', admin:'Admin', mon:'Lun', tue:'Mar', wed:'Mié', thu:'Jue', fri:'Vie', sat:'Sáb', sun:'Dom',
    stillIn:'Todavía en el reloj', approvedCount:n=>`${n} aprobado(s).`, search:'Buscar…'
  },
  en: {
    appTitle:'IMT Timeclock', empNum:'Employee number', pin:'PIN (6 digits)', signIn:'Sign in', next:'Next', back:'Back',
    badLogin:'Wrong number or PIN.', logout:'Sign out', clock:'Clock', crew:'Crew', office:'Office',
    clockedOut:'Clocked out', clockedIn:'Clocked in', since:'Since', job:'Job', pickJob:'Pick the job',
    clockIn:'CLOCK IN', clockOut:'CLOCK OUT', changeJob:'Change job', thisWeek:'This week', hours:'hours',
    lunchNote:'1 hour lunch is deducted per day.', gettingGps:'Getting location…', done:'Done',
    confirmOut:'Clock out now?', yes:'Yes', no:'No', cancel:'Cancel', save:'Save',
    date:'Date', name:'Name', in:'In', out:'Out', total:'Total', lunch:'Lunch', status:'Status',
    approve:'Approve', approveAll:'Approve all', approved:'Approved', submitted:'To approve', open:'Open', missed:'Missed clock-out',
    nothing:'No hours for this day.', edit:'Fix', reason:'Reason for change', reasonReq:'Enter a reason.',
    selectAll:'Select', week:'Week', reg:'Regular', ot:'OT', unapproved:'Unapproved',
    payroll:'Payroll', certified:'Certified payroll', pending:'To approve', employees:'Employees', jobs:'Jobs',
    download:'Download CSV', setPin:'Set PIN', role:'Role', language:'Language', active:'Active', hasPin:'Has PIN',
    newPin:'New PIN (6 digits)', pinSaved:'PIN saved.', saved:'Saved.', certifiedQ:'Certified payroll',
    prev:'‹ Prev', nextW:'Next ›', noSignal:'No signal. Try again when you have signal.',
    already_clocked_in:'Already clocked in.', not_clocked_in:'Not clocked in.', job_not_active:'That job is not active.',
    not_an_employee:'Your login is not active. Talk to the office.', not_allowed:'Not allowed.',
    pin_must_be_6_digits:'PIN must be 6 numbers.', reason_required:'Enter a reason.',
    worker:'Worker', foreman:'Foreman', officeRole:'Office', admin:'Admin', mon:'Mon', tue:'Tue', wed:'Wed', thu:'Thu', fri:'Fri', sat:'Sat', sun:'Sun',
    stillIn:'Still clocked in', approvedCount:n=>`${n} approved.`, search:'Search…'
  }
};
let lang = localStorage.getItem('lang') || ((navigator.language||'es').startsWith('en') ? 'en' : 'es');
const t = k => (T[lang][k] ?? k);

// ---------------- state ----------------
const S = { me:null, jobs:[], tab:'clock', officeTab:'payroll', crewDate:todayStr(), week:weekStart(todayStr()), timer:null };
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function todayStr(d = new Date()) { const z = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; }
function weekStart(ds) { const d = new Date(ds + 'T12:00:00'); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); return todayStr(d); }
function addDays(ds, n) { const d = new Date(ds + 'T12:00:00'); d.setDate(d.getDate() + n); return todayStr(d); }
function fmtTime(iso) { return iso ? new Date(iso).toLocaleTimeString(lang === 'es' ? 'es-MX' : 'en-US', { hour:'numeric', minute:'2-digit' }) : '—'; }
function fmtDate(ds) { return new Date(ds + 'T12:00:00').toLocaleDateString(lang === 'es' ? 'es-MX' : 'en-US', { weekday:'short', month:'short', day:'numeric' }); }
function h(n) { return (Math.round((Number(n) || 0) * 100) / 100).toFixed(2); }
function toLocalInput(iso) { if (!iso) return ''; const d = new Date(iso); const z = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`; }
function errText(e) {
  const m = (e && (e.message || e.error_description || String(e))) || '';
  for (const k of ['already_clocked_in','not_clocked_in','job_not_active','not_an_employee','not_allowed','pin_must_be_6_digits','reason_required']) if (m.includes(k)) return t(k);
  if (/fetch|network|Failed/i.test(m)) return t('noSignal');
  return m;
}
function jobName(code) { const j = S.jobs.find(x => x.code === code); return j ? `${j.code} – ${j.description}` : (code || '—'); }
function isLead() { return S.me && ['foreman','office','admin'].includes(S.me.role); }
function isOffice() { return S.me && ['office','admin'].includes(S.me.role); }

window.toggleLang = () => { lang = lang === 'es' ? 'en' : 'es'; localStorage.setItem('lang', lang); render(); };
window.logout = async () => { await sb.auth.signOut(); S.me = null; render(); };

// ---------------- boot ----------------
async function loadMe() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { S.me = null; return; }
  const { data, error } = await sb.from('tc_employees').select('*').eq('is_me', true).maybeSingle();
  if (error || !data) { S.me = null; return; }
  S.me = data;
  if (!localStorage.getItem('lang')) lang = data.language;
  const { data: jobs } = await sb.from('tc_jobs').select('*').order('code');
  S.jobs = jobs || [];
}

function renderChrome() {
  document.documentElement.lang = lang;
  document.getElementById('title').textContent = S.me ? `${t('appTitle')} · ${S.me.first_name}` : t('appTitle');
  document.getElementById('langBtn').textContent = lang === 'es' ? 'EN' : 'ES';
  const lo = document.getElementById('logoutBtn'); lo.textContent = t('logout'); lo.classList.toggle('hide', !S.me);
  const nav = document.getElementById('tabs');
  if (!S.me || !isLead()) { nav.classList.add('hide'); nav.innerHTML = ''; return; }
  const tabs = [['clock', t('clock')], ['crew', t('crew')]];
  if (isOffice()) tabs.push(['office', t('office')]);
  nav.classList.remove('hide');
  nav.innerHTML = tabs.map(([k, l]) => `<button class="${S.tab === k ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('');
  nav.querySelectorAll('button').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); });
}

async function render() {
  clearInterval(S.timer);
  renderChrome();
  if (!S.me) return renderLogin();
  if (S.tab === 'crew' && isLead()) return renderCrew();
  if (S.tab === 'office' && isOffice()) return renderOffice();
  return renderClock();
}

// ---------------- login ----------------
function renderLogin(step = 'code', code = '') {
  if (step === 'code') {
    $app.innerHTML = `<div class="card">
      <label>${t('empNum')}</label>
      <input id="code" inputmode="numeric" autocomplete="username" value="${esc(code || localStorage.getItem('lastCode') || '')}" placeholder="0002">
      <div id="e"></div>
      <button class="btn primary" style="width:100%;margin-top:14px;padding:14px;font-size:18px" id="go">${t('next')}</button></div>`;
    const go = () => { const c = document.getElementById('code').value.trim(); if (c) renderLogin('pin', c); };
    document.getElementById('go').onclick = go;
    document.getElementById('code').onkeydown = e => { if (e.key === 'Enter') go(); };
    return;
  }
  let pin = '';
  $app.innerHTML = `<div class="card" style="text-align:center">
    <div class="muted">${t('empNum')}: <b>${esc(code)}</b></div>
    <div class="status">${t('pin')}</div>
    <div class="dots" id="dots">${'<span></span>'.repeat(6)}</div>
    <div id="e"></div>
    <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join('')}
      <button data-k="back">←</button><button data-k="0">0</button><button data-k="x">✕</button></div>
    <button class="btn" style="margin-top:14px" id="chg">${t('back')}</button></div>`;
  const dots = () => document.querySelectorAll('#dots span').forEach((s, i) => s.classList.toggle('f', i < pin.length));
  document.getElementById('chg').onclick = () => renderLogin('code', code);
  document.querySelectorAll('.keypad button').forEach(b => b.onclick = async () => {
    const k = b.dataset.k;
    if (k === 'back') pin = pin.slice(0, -1); else if (k === 'x') pin = ''; else if (pin.length < 6) pin += k;
    dots();
    if (pin.length === 6) {
      const email = 'e' + code.toLowerCase().replace(/[^a-z0-9]/g, '') + '@imt-timeclock.app';
      const { error } = await sb.auth.signInWithPassword({ email, password: pin });
      if (error) { pin = ''; dots(); document.getElementById('e').innerHTML = `<div class="err">${/fetch|network/i.test(error.message) ? t('noSignal') : t('badLogin')}</div>`; return; }
      localStorage.setItem('lastCode', code);
      await loadMe();
      if (!S.me) { document.getElementById('e').innerHTML = `<div class="err">${t('not_an_employee')}</div>`; await sb.auth.signOut(); return; }
      S.tab = 'clock'; render();
    }
  });
}

// ---------------- clock (everyone) ----------------
function getGps() {
  return new Promise(res => {
    if (!navigator.geolocation) return res({});
    navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude }), () => res({}), { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
  });
}

async function renderClock(flash = '') {
  const ws = weekStart(todayStr());
  const { data: shifts, error } = await sb.from('tc_shifts').select('*').eq('employee_code', S.me.code).gte('week_start', addDays(ws, -7)).order('clock_in', { ascending: false });
  if (error) { $app.innerHTML = `<div class="err">${esc(errText(error))}</div>`; return; }
  const open = (shifts || []).find(s => !s.clock_out);
  const weekTotal = (shifts || []).filter(s => s.week_start === ws).reduce((a, s) => a + Number(s.net_hours), 0);
  const lastJob = open?.job_code || (shifts || [])[0]?.job_code || localStorage.getItem('lastJob') || '';
  const jobOpts = S.jobs.filter(j => j.is_active).map(j => `<option value="${esc(j.code)}" ${j.code === lastJob ? 'selected' : ''}>${esc(j.code)} – ${esc(j.description)}</option>`).join('');

  const days = {};
  (shifts || []).filter(s => s.week_start === ws).forEach(s => { days[s.work_date] = (days[s.work_date] || 0) + Number(s.net_hours); });

  $app.innerHTML = `
    ${flash ? `<div class="msg">${esc(flash)}</div>` : ''}
    <div class="card">
      <div class="muted">${fmtDate(todayStr())}</div>
      <div class="status">${open ? '🟢 ' + t('clockedIn') : '⚪ ' + t('clockedOut')}</div>
      ${open ? `<div class="muted">${t('job')}: <b>${esc(jobName(open.job_code))}</b><br>${t('since')} ${fmtTime(open.clock_in)}</div>
                <div class="timer" id="timer"></div>
                <button class="big out" id="outBtn">${t('clockOut')}</button>
                <details style="margin-top:14px"><summary class="muted">${t('changeJob')}</summary>
                  <select id="job" style="margin-top:8px">${jobOpts}</select>
                  <button class="btn primary" style="width:100%;margin-top:8px" id="swBtn">${t('changeJob')}</button></details>`
             : `<label>${t('pickJob')}</label><select id="job"><option value="">—</option>${jobOpts}</select>
                <div style="height:14px"></div><button class="big in" id="inBtn">${t('clockIn')}</button>`}
      <div id="e"></div>
    </div>
    <div class="card">
      <div class="row"><b>${t('thisWeek')}</b><div style="text-align:right;font-size:22px;font-weight:700">${h(weekTotal)} <span class="muted">${t('hours')}</span></div></div>
      <table style="margin-top:8px">${Object.keys(days).sort().map(d => `<tr><td>${fmtDate(d)}</td><td class="n">${h(days[d])}</td></tr>`).join('') || `<tr><td class="muted">—</td></tr>`}</table>
      <div class="muted" style="margin-top:8px">${t('lunchNote')}</div>
    </div>`;

  const err = m => document.getElementById('e').innerHTML = `<div class="err">${esc(m)}</div>`;
  const busy = (btn, on) => { if (btn) { btn.disabled = on; if (on) btn.textContent = t('gettingGps'); } };

  if (open) {
    const tick = () => { const s = Math.max(0, (Date.now() - new Date(open.clock_in)) / 1000); const el = document.getElementById('timer'); if (el) el.textContent = `${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,'0')}`; };
    tick(); S.timer = setInterval(tick, 30000);
    document.getElementById('outBtn').onclick = async e => {
      if (!confirm(t('confirmOut'))) return;
      busy(e.target, true);
      const g = await getGps();
      const { error } = await sb.rpc('tc_clock_out', { p_lat: g.lat ?? null, p_lng: g.lng ?? null });
      if (error) { busy(e.target, false); e.target.textContent = t('clockOut'); return err(errText(error)); }
      renderClock(`${t('done')} ✓`);
    };
    document.getElementById('swBtn').onclick = async e => {
      const job = document.getElementById('job').value; if (!job || job === open.job_code) return;
      busy(e.target, true);
      const g = await getGps();
      const { error } = await sb.rpc('tc_switch_job', { p_job: job, p_lat: g.lat ?? null, p_lng: g.lng ?? null });
      if (error) { busy(e.target, false); e.target.textContent = t('changeJob'); return err(errText(error)); }
      localStorage.setItem('lastJob', job); renderClock(`${t('done')} ✓`);
    };
  } else {
    document.getElementById('inBtn').onclick = async e => {
      const job = document.getElementById('job').value;
      if (!job) return err(t('pickJob'));
      busy(e.target, true);
      const g = await getGps();
      const { error } = await sb.rpc('tc_clock_in', { p_job: job, p_lat: g.lat ?? null, p_lng: g.lng ?? null });
      if (error) { busy(e.target, false); e.target.textContent = t('clockIn'); return err(errText(error)); }
      localStorage.setItem('lastJob', job); renderClock(`${t('done')} ✓`);
    };
  }
}

// ---------------- crew (foreman + office) ----------------
function statusTag(s) {
  if (s.missed_clockout) return `<span class="tag bad">${t('missed')}</span>`;
  if (!s.clock_out) return `<span class="tag">${t('stillIn')}</span>`;
  if (s.status === 'approved') return `<span class="tag ok">${t('approved')}</span>`;
  return `<span class="tag warn">${t('submitted')}</span>`;
}

async function renderCrew(flash = '') {
  const d = S.crewDate;
  let q = sb.from('tc_shifts').select('*').eq('work_date', d).neq('employee_code', S.me.code).order('last_name');
  const { data, error } = await q;
  if (error) { $app.innerHTML = `<div class="err">${esc(errText(error))}</div>`; return; }
  // Missed clock-outs from earlier days also show here
  const { data: missed } = await sb.from('tc_shifts').select('*').eq('missed_clockout', true).neq('employee_code', S.me.code).lt('work_date', d);
  const rows = [...(missed || []), ...(data || [])];
  $app.innerHTML = `
    ${flash ? `<div class="msg">${esc(flash)}</div>` : ''}
    <div class="card">
      <div class="row"><button class="btn" id="pd" style="flex:0">‹</button><input type="date" id="dt" value="${d}"><button class="btn" id="nd" style="flex:0">›</button></div>
    </div>
    <div class="card">
      ${rows.length ? `<div class="scroll"><table>
        <tr><th></th><th>${t('name')}</th><th>${t('job')}</th><th>${t('in')}</th><th>${t('out')}</th><th class="n">${t('total')}</th><th>${t('status')}</th><th></th></tr>
        ${rows.map(s => `<tr>
          <td>${s.clock_out && s.status !== 'approved' ? `<input type="checkbox" class="ck" value="${s.id}" checked style="width:22px;height:22px">` : ''}</td>
          <td><b>${esc(s.first_name)} ${esc(s.last_name)}</b>${s.work_date !== d ? `<br><span class="muted">${fmtDate(s.work_date)}</span>` : ''}</td>
          <td>${esc(s.job_code || '—')}</td>
          <td>${fmtTime(s.clock_in)}</td><td>${fmtTime(s.clock_out)}</td>
          <td class="n">${s.clock_out ? h(s.net_hours) : '—'}</td>
          <td>${statusTag(s)}</td>
          <td><button class="btn" data-edit="${s.id}">${t('edit')}</button></td></tr>`).join('')}
      </table></div>
      <button class="btn green" style="width:100%;margin-top:14px;padding:14px;font-size:17px" id="apr">${t('approve')}</button>`
      : `<div class="muted">${t('nothing')}</div>`}
      <div id="e"></div>
    </div>`;
  document.getElementById('dt').onchange = e => { S.crewDate = e.target.value; renderCrew(); };
  document.getElementById('pd').onclick = () => { S.crewDate = addDays(d, -1); renderCrew(); };
  document.getElementById('nd').onclick = () => { S.crewDate = addDays(d, 1); renderCrew(); };
  const apr = document.getElementById('apr');
  if (apr) apr.onclick = async () => {
    const ids = [...document.querySelectorAll('.ck:checked')].map(c => c.value);
    if (!ids.length) return;
    const { data: n, error } = await sb.rpc('tc_approve', { p_ids: ids });
    if (error) return document.getElementById('e').innerHTML = `<div class="err">${esc(errText(error))}</div>`;
    renderCrew(T[lang].approvedCount(n));
  };
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editDialog(rows.find(r => r.id === b.dataset.edit), () => renderCrew(t('saved'))));
}

function editDialog(s, after) {
  const dlg = document.getElementById('dlg');
  const jobOpts = S.jobs.map(j => `<option value="${esc(j.code)}" ${j.code === s.job_code ? 'selected' : ''}>${esc(j.code)} – ${esc(j.description)}</option>`).join('');
  document.getElementById('dlgBody').innerHTML = `
    <div class="status">${esc(s.first_name)} ${esc(s.last_name)}</div>
    <label>${t('job')}</label><select id="ej">${jobOpts}</select>
    <label>${t('in')}</label><input type="datetime-local" id="ei" value="${toLocalInput(s.clock_in)}">
    <label>${t('out')}</label><input type="datetime-local" id="eo" value="${toLocalInput(s.clock_out)}">
    <label>${t('reason')}</label><input id="er" maxlength="200">
    <div id="ee"></div>
    <div class="row" style="margin-top:14px"><button class="btn" id="ec">${t('cancel')}</button><button class="btn primary" id="es">${t('save')}</button></div>`;
  dlg.showModal();
  document.getElementById('ec').onclick = () => dlg.close();
  document.getElementById('es').onclick = async () => {
    const reason = document.getElementById('er').value.trim();
    if (!reason) return document.getElementById('ee').innerHTML = `<div class="err">${t('reasonReq')}</div>`;
    const ci = document.getElementById('ei').value, co = document.getElementById('eo').value;
    const { error } = await sb.rpc('tc_edit_entry', { p_id: s.id, p_clock_in: new Date(ci).toISOString(), p_clock_out: co ? new Date(co).toISOString() : null, p_job: document.getElementById('ej').value, p_reason: reason });
    if (error) return document.getElementById('ee').innerHTML = `<div class="err">${esc(errText(error))}</div>`;
    dlg.close(); after();
  };
}

// ---------------- office ----------------
function csv(rows, cols, name) {
  const body = [cols.map(c => c[1]).join(','), ...rows.map(r => cols.map(c => `"${String(r[c[0]] ?? '').replace(/"/g, '""')}"`).join(','))].join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], { type: 'text/csv' })); a.download = name; a.click();
}

async function renderOffice(flash = '') {
  const sub = [['payroll', t('payroll')], ['pending', t('pending')], ['certified', t('certified')], ['employees', t('employees')], ['jobs', t('jobs')]];
  const weekBar = `<div class="row" style="margin-bottom:12px"><button class="btn" id="pw" style="flex:0;white-space:nowrap">${t('prev')}</button>
    <div style="text-align:center"><b>${t('week')}</b> ${fmtDate(S.week)} – ${fmtDate(addDays(S.week, 6))}</div>
    <button class="btn" id="nw" style="flex:0;white-space:nowrap">${t('nextW')}</button></div>`;
  let body = '';
  const ot = S.officeTab;

  if (ot === 'payroll') {
    const { data = [] } = await sb.from('tc_weekly_payroll').select('*').eq('week_start', S.week).order('last_name');
    S._rows = data;
    body = weekBar + `<div class="scroll"><table><tr><th>#</th><th>${t('name')}</th><th class="n">${t('reg')}</th><th class="n">${t('ot')}</th><th class="n">${t('total')}</th><th>${t('status')}</th></tr>
      ${data.map(r => `<tr><td>${esc(r.employee_code)}</td><td>${esc(r.last_name)}, ${esc(r.first_name)}</td><td class="n">${h(r.regular_hours)}</td><td class="n"><b>${h(r.overtime_hours)}</b></td><td class="n">${h(r.total_hours)}</td>
        <td>${r.has_missed_clockout ? `<span class="tag bad">${t('missed')}</span>` : r.unapproved_shifts > 0 ? `<span class="tag warn">${r.unapproved_shifts} ${t('unapproved')}</span>` : `<span class="tag ok">${t('approved')}</span>`}</td></tr>`).join('') || `<tr><td colspan="6" class="muted">—</td></tr>`}
      <tr><th></th><th>${t('total')}</th><th class="n">${h(data.reduce((a, r) => a + +r.regular_hours, 0))}</th><th class="n">${h(data.reduce((a, r) => a + +r.overtime_hours, 0))}</th><th class="n">${h(data.reduce((a, r) => a + +r.total_hours, 0))}</th><th></th></tr></table></div>
      <button class="btn" id="dl" style="margin-top:12px">${t('download')}</button>`;
  }

  if (ot === 'pending') {
    const { data = [] } = await sb.from('tc_shifts').select('*').neq('status', 'approved').gte('week_start', addDays(S.week, -7)).lte('week_start', S.week).order('work_date').order('last_name');
    S._rows = data;
    body = weekBar + `<div class="scroll"><table><tr><th></th><th>${t('date')}</th><th>${t('name')}</th><th>${t('job')}</th><th>${t('in')}</th><th>${t('out')}</th><th class="n">${t('total')}</th><th></th></tr>
      ${data.map(s => `<tr><td>${s.clock_out ? `<input type="checkbox" class="ck" value="${s.id}" style="width:22px;height:22px">` : ''}</td>
        <td>${fmtDate(s.work_date)}</td><td>${esc(s.first_name)} ${esc(s.last_name)}</td><td>${esc(s.job_code || '—')}</td>
        <td>${fmtTime(s.clock_in)}</td><td>${s.missed_clockout ? `<span class="tag bad">${t('missed')}</span>` : fmtTime(s.clock_out)}</td>
        <td class="n">${s.clock_out ? h(s.net_hours) : '—'}</td><td><button class="btn" data-edit="${s.id}">${t('edit')}</button></td></tr>`).join('') || `<tr><td colspan="8" class="muted">—</td></tr>`}
      </table></div><button class="btn green" style="margin-top:12px" id="apr">${t('approve')}</button>`;
  }

  if (ot === 'certified') {
    const { data = [] } = await sb.from('tc_certified_payroll').select('*').eq('week_start', S.week).order('job_code').order('last_name');
    S._rows = data;
    const byJob = {}; data.forEach(r => (byJob[r.job_code] ||= []).push(r));
    const dk = ['mon','tue','wed','thu','fri','sat','sun'];
    body = weekBar + (Object.keys(byJob).map(j => `<h3 style="margin:16px 0 6px">${esc(jobName(j))}</h3><div class="scroll"><table>
      <tr><th>#</th><th>${t('name')}</th>${dk.map(k => `<th class="n">${t(k)}</th>`).join('')}<th class="n">${t('total')}</th></tr>
      ${byJob[j].map(r => `<tr><td>${esc(r.employee_code)}</td><td>${esc(r.last_name)}, ${esc(r.first_name)}${r.unapproved_shifts > 0 ? ` <span class="tag warn">${t('unapproved')}</span>` : ''}</td>${dk.map(k => `<td class="n">${r[k] ? h(r[k]) : ''}</td>`).join('')}<td class="n"><b>${h(r.total_hours)}</b></td></tr>`).join('')}
      </table></div>`).join('') || `<div class="muted">—</div>`) + `<button class="btn" id="dl" style="margin-top:12px">${t('download')}</button>`;
  }

  if (ot === 'employees') {
    const { data = [] } = await sb.from('tc_employees').select('*').order('code');
    S._rows = data;
    const roles = [['worker', t('worker')], ['foreman', t('foreman')], ['office', t('officeRole')], ['admin', t('admin')]];
    body = `<div class="scroll"><table><tr><th>#</th><th>${t('name')}</th><th>${t('role')}</th><th>${t('language')}</th><th>${t('active')}</th><th>${t('hasPin')}</th><th></th></tr>
      ${data.map(e => `<tr data-code="${esc(e.code)}"><td>${esc(e.code)}</td><td>${esc(e.last_name)}, ${esc(e.first_name)}</td>
        <td><select class="er" style="font-size:14px;padding:6px">${roles.map(([v, l]) => `<option value="${v}" ${e.role === v ? 'selected' : ''}>${l}</option>`).join('')}</select></td>
        <td><select class="el" style="font-size:14px;padding:6px"><option value="es" ${e.language === 'es' ? 'selected' : ''}>ES</option><option value="en" ${e.language === 'en' ? 'selected' : ''}>EN</option></select></td>
        <td><input type="checkbox" class="ea" ${e.is_active ? 'checked' : ''} style="width:22px;height:22px"></td>
        <td>${e.has_pin ? '✓' : ''}</td><td><button class="btn" data-pin="${esc(e.code)}">${t('setPin')}</button></td></tr>`).join('')}
      </table></div>`;
  }

  if (ot === 'jobs') {
    const { data = [] } = await sb.from('tc_jobs').select('*').order('code');
    S._rows = data;
    body = `<div class="scroll"><table><tr><th>#</th><th>${t('job')}</th><th>${t('active')}</th><th>${t('certifiedQ')}</th></tr>
      ${data.map(j => `<tr data-code="${esc(j.code)}"><td>${esc(j.code)}</td><td>${esc(j.description)}</td>
        <td><input type="checkbox" class="ja" ${j.is_active ? 'checked' : ''} style="width:22px;height:22px"></td>
        <td><input type="checkbox" class="jc" ${j.certified_payroll ? 'checked' : ''} style="width:22px;height:22px"></td></tr>`).join('')}
      </table></div>`;
  }

  $app.innerHTML = `${flash ? `<div class="msg">${esc(flash)}</div>` : ''}
    <div class="subtabs">${sub.map(([k, l]) => `<button class="${ot === k ? 'on' : ''}" data-sub="${k}">${l}</button>`).join('')}</div>
    <div class="card">${body}<div id="e"></div></div>`;

  document.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => { S.officeTab = b.dataset.sub; renderOffice(); });
  const pw = document.getElementById('pw'), nw = document.getElementById('nw');
  if (pw) pw.onclick = () => { S.week = addDays(S.week, -7); renderOffice(); };
  if (nw) nw.onclick = () => { S.week = addDays(S.week, 7); renderOffice(); };
  const err = m => document.getElementById('e').innerHTML = `<div class="err">${esc(m)}</div>`;
  const dl = document.getElementById('dl');
  if (dl && ot === 'payroll') dl.onclick = () => csv(S._rows, [['employee_code','Employee'],['last_name','Last'],['first_name','First'],['regular_hours','Regular'],['overtime_hours','OT'],['total_hours','Total'],['unapproved_shifts','Unapproved']], `payroll_${S.week}.csv`);
  if (dl && ot === 'certified') dl.onclick = () => csv(S._rows, [['job_code','Job'],['job_description','Job name'],['employee_code','Employee'],['last_name','Last'],['first_name','First'],['mon','Mon'],['tue','Tue'],['wed','Wed'],['thu','Thu'],['fri','Fri'],['sat','Sat'],['sun','Sun'],['total_hours','Total']], `certified_${S.week}.csv`);
  const apr = document.getElementById('apr');
  if (apr) apr.onclick = async () => {
    const ids = [...document.querySelectorAll('.ck:checked')].map(c => c.value); if (!ids.length) return;
    const { data: n, error } = await sb.rpc('tc_approve', { p_ids: ids });
    if (error) return err(errText(error));
    renderOffice(T[lang].approvedCount(n));
  };
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editDialog(S._rows.find(r => r.id === b.dataset.edit), () => renderOffice(t('saved'))));
  document.querySelectorAll('tr[data-code] .er, tr[data-code] .el, tr[data-code] .ea').forEach(el => el.onchange = async () => {
    const tr = el.closest('tr');
    const { error } = await sb.rpc('tc_set_employee', { p_code: tr.dataset.code, p_role: tr.querySelector('.er').value, p_language: tr.querySelector('.el').value, p_active: tr.querySelector('.ea').checked });
    error ? err(errText(error)) : (document.getElementById('e').innerHTML = `<div class="msg">${t('saved')}</div>`);
  });
  document.querySelectorAll('tr[data-code] .ja, tr[data-code] .jc').forEach(el => el.onchange = async () => {
    const tr = el.closest('tr');
    const { error } = await sb.rpc('tc_set_job', { p_code: tr.dataset.code, p_active: tr.querySelector('.ja').checked, p_certified: tr.querySelector('.jc').checked });
    error ? err(errText(error)) : (document.getElementById('e').innerHTML = `<div class="msg">${t('saved')}</div>`);
  });
  document.querySelectorAll('[data-pin]').forEach(b => b.onclick = async () => {
    const pin = prompt(`${b.dataset.pin} — ${t('newPin')}`);
    if (pin === null) return;
    const { error } = await sb.rpc('tc_set_pin', { p_code: b.dataset.pin, p_pin: pin.trim() });
    error ? err(errText(error)) : renderOffice(t('pinSaved'));
  });
}

// ---------------- start ----------------
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') { S.me = null; render(); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.me) render(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
await loadMe();
render();
</script>
</body>
</html>
